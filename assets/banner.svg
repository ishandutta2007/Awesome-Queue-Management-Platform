<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1f1635" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="accent-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.05" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 44px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 18px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #38bdf8;
    }
    .node-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 12px;
      fill: #cbd5e1;
    }
    .pulse-circle {
      animation: pulse 3s infinite ease-in-out;
    }
    .stream-line {
      stroke-dasharray: 8, 8;
      animation: dash 20s linear infinite;
    }
    .flow-dot {
      animation: flow 4s infinite linear;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.6; }
      50% { transform: scale(1.08); opacity: 0.9; }
    }
    @keyframes dash {
      to { stroke-dashoffset: -1000; }
    }
    @keyframes flow {
      0% { transform: translateX(0); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateX(880px); opacity: 0; }
    }
  </style>

  <!-- Background Canvas -->
  <rect width="100%" height="100%" fill="url(#bg-grad)" rx="16" />
  
  <!-- Subtle Grid Pattern Background -->
  <g stroke="#334155" stroke-width="0.5" opacity="0.25">
    <path d="M0,60 H1200 M0,120 H1200 M0,180 H1200 M0,240 H1200 M0,300 H1200" />
    <path d="M120,0 V360 M240,0 V360 M360,0 V360 M480,0 V360 M600,0 V360 M720,0 V360 M840,0 V360 M960,0 V360 M1080,0 V360" />
  </g>

  <!-- Ambient Light Orbs -->
  <circle cx="150" cy="80" r="140" fill="url(#glow-grad)" filter="url(#glow)" />
  <circle cx="1020" cy="260" r="180" fill="url(#glow-grad)" filter="url(#glow)" />

  <!-- Left Header Section -->
  <g transform="translate(60, 65)">
    <!-- Pill Tag -->
    <rect width="250" height="32" rx="16" fill="#0c4a6e" fill-opacity="0.6" stroke="#0284c7" stroke-width="1.2" />
    <circle cx="16" cy="16" r="5" fill="#38bdf8" />
    <text x="30" y="21" class="badge-text">⚡ ENTERPRISE &amp; OPEN SOURCE</text>

    <!-- Main Title -->
    <text x="0" y="80" class="title">
      Awesome <tspan fill="url(#accent-cyan)">Queue Management</tspan>
    </text>
    
    <!-- Subtitle -->
    <text x="0" y="118" class="subtitle">
      Smart Customer Flows • Virtual Queues • Kiosks • Waiting-Time Optimization
    </text>
  </g>

  <!-- Dynamic Workflow & Architecture Graphic -->
  <g transform="translate(60, 215)">
    <!-- Flow Connector Line -->
    <line x1="60" y1="50" x2="1020" y2="50" stroke="#3b82f6" stroke-width="3" stroke-opacity="0.35" />
    <line x1="60" y1="50" x2="1020" y2="50" stroke="url(#accent-cyan)" stroke-width="2.5" class="stream-line" />

    <!-- Step 1: Kiosk / QR Check-In -->
    <g transform="translate(40, 15)">
      <rect width="150" height="70" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" filter="url(#soft-glow)" />
      <text x="75" y="32" text-anchor="middle" font-size="18">📱</text>
      <text x="75" y="54" text-anchor="middle" class="node-text">1. Digital Check-In</text>
    </g>

    <!-- Step 2: Virtual Queue & Routing -->
    <g transform="translate(260, 15)">
      <rect width="150" height="70" rx="12" fill="#1e293b" stroke="#60a5fa" stroke-width="1.5" />
      <text x="75" y="32" text-anchor="middle" font-size="18">🎫</text>
      <text x="75" y="54" text-anchor="middle" class="node-text">2. Virtual Queue</text>
    </g>

    <!-- Step 3: Smart Staff Calling -->
    <g transform="translate(480, 15)">
      <rect width="150" height="70" rx="12" fill="#1e293b" stroke="#818cf8" stroke-width="1.5" />
      <text x="75" y="32" text-anchor="middle" font-size="18">🔔</text>
      <text x="75" y="54" text-anchor="middle" class="node-text">3. Staff Calling</text>
    </g>

    <!-- Step 4: Live TV Display Board -->
    <g transform="translate(700, 15)">
      <rect width="150" height="70" rx="12" fill="#1e293b" stroke="#c084fc" stroke-width="1.5" />
      <text x="75" y="32" text-anchor="middle" font-size="18">📺</text>
      <text x="75" y="54" text-anchor="middle" class="node-text">4. Live Display Board</text>
    </g>

    <!-- Step 5: Service Analytics -->
    <g transform="translate(920, 15)">
      <rect width="150" height="70" rx="12" fill="#1e293b" stroke="#f472b6" stroke-width="1.5" filter="url(#soft-glow)" />
      <text x="75" y="32" text-anchor="middle" font-size="18">📊</text>
      <text x="75" y="54" text-anchor="middle" class="node-text">5. Analytics &amp; SLA</text>
    </g>

    <!-- Moving Glow Pulse Particle -->
    <circle cx="100" cy="50" r="5" fill="#38bdf8" filter="url(#soft-glow)" class="flow-dot" />
  </g>
</svg>